# OpenSearch File API 配置文件示例

server:
  port: 8080
  host: "0.0.0.0"
  mode: "release"  # debug, release, test
  read_timeout: 30s
  write_timeout: 60s

opensearch:
  host: "localhost"
  port: 9200
  username: "admin"
  password: "admin"
  secure: true
  insecure_skip_verify: true  # 跳过 TLS 证书验证（自签名证书时使用）
  index_prefix: "tenant"

storage:
  type: "local"  # local 或 s3
  local_path: "./data/files"

  # S3 配置（当 type=s3 时使用）
  # s3_bucket: "my-bucket"
  # s3_region: "us-east-1"
  # s3_endpoint: ""  # MinIO 等兼容服务
  # s3_key_id: ""
  # s3_secret: ""
  # use_path_style: true  # MinIO=true, 阿里云 OSS=false

  # Qwen3.7-Plus 统一文档解析（必须配置）
  # 支持: PDF(含扫描件)、图片(JPG/PNG/TIFF/BMP)、Office(docx/xlsx/pptx)、文本、EPUB
  doc_parse_provider: "qwen"
  doc_parse_api_url: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
  doc_parse_api_key: "${DASHSCOPE_API_KEY}"
  doc_parse_model: "qwen3.7-plus"

jwt:
  secret: "change-this-secret-key"
  issuer: "opensearch-file-api"
  expire_time: 24h

log:
  level: "info"
  format: "json"  # json 或 console

embedding:
  provider: "openai"  # openai, local, clip
  model: "text-embedding-3-small"
  api_key: ""
  api_url: ""
  dimensions: 1536
  batch_size: 10
  timeout: 30  # 秒

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.26'
  IMAGE_NAME: opensearch-file-api
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # 代码质量检查
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  # 单元测试
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.out
          flags: unittests

  # 构建
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build -v -ldflags "-X main.Version=${{ github.sha }} -X main.BuildTime=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" ./cmd/server

  # Docker 构建
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

  # E2E 端到端测试
  e2e:
    name: E2E Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          load: true
          tags: opensearch-file-api:latest
          build-args: |
            VERSION=e2e-test
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Start services
        run: |
          cd deployments/docker
          docker compose up -d opensearch minio
          # Wait for OpenSearch
          for i in {1..30}; do
            if curl -sf http://localhost:9200/_cluster/health >/dev/null; then
              echo "OpenSearch is ready!"
              break
            fi
            echo "Waiting for OpenSearch... ($i/30)"
            sleep 5
          done
          # Start API
          docker compose up -d opensearch-file-api
          sleep 5

      - name: Run E2E tests
        run: bash scripts/test_e2e.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          cd deployments/docker
          docker compose logs opensearch-file-api
          docker compose logs opensearch

      - name: Stop services
        if: always()
        run: |
          cd deployments/docker
          docker compose down

  # E2E 端到端测试（带 Embedding）
  e2e-embedding:
    name: E2E Test (Embedding)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          load: true
          tags: opensearch-file-api:latest
          build-args: |
            VERSION=e2e-embedding
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Start services
        run: |
          cd deployments/docker
          docker compose up -d opensearch minio
          # Wait for OpenSearch
          for i in {1..30}; do
            if curl -sf http://localhost:9200/_cluster/health >/dev/null; then
              echo "OpenSearch is ready!"
              break
            fi
            echo "Waiting for OpenSearch... ($i/30)"
            sleep 5
          done

      - name: Run E2E embedding tests
        run: bash scripts/test_e2e_embedding.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          cd deployments/docker
          docker compose logs
          docker ps -a

      - name: Stop services
        if: always()
        run: |
          cd deployments/docker
          docker compose down
          pkill -f mock_embedding_server.py || true

  # Helm lint
  helm:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.0

      - name: Run helm lint
        run: helm lint deployments/helm/opensearch-file-api

      - name: Helm template test
        run: helm template test deployments/helm/opensearch-file-api --values deployments/helm/opensearch-file-api/values.yaml

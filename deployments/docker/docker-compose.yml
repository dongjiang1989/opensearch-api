services:
  # OpenSearch 单节点（开发环境）
  opensearch:
    image: opensearchproject/opensearch:3.2.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Str0ng!P@ssw0rd
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - opensearch-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO (S3 兼容存储，开发环境)
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    ports:
      - "19000:9000"
      - "19001:9001"
    command: server /data --console-address ":9001"
    networks:
      - opensearch-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO 初始化 - 自动创建 bucket
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set myminio http://minio:9000 minioadmin minioadmin123;
        mc mb -p myminio/opensearch-files 2>/dev/null || true;
      "
    networks:
      - opensearch-net

  # ============================================================
  # 嵌入服务 (可选) - 通过 profile 按需启用
  # ============================================================

  # Ollama - 文本向量嵌入 (nomic-embed-text)
  # 对应 provider: local
  # 启动: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - opensearch-net
    restart: unless-stopped
    profiles:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 30s
      timeout: 10s
      retries: 5
    entrypoint: >
      sh -c "
        ollama serve &
        until curl -s http://localhost:11434 >/dev/null 2>&1; do sleep 1; done;
        ollama pull nomic-embed-text;
        wait
      "

  # CLIP - 图像识别 & 图文多模态匹配
  # 对应 provider: clip
  # 启动: docker compose --profile clip up -d
  clip-server:
    image: lecm/clip-server:latest
    container_name: clip-server
    ports:
      - "8000:8000"
    networks:
      - opensearch-net
    restart: unless-stopped
    profiles:
      - clip
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================
  # 应用服务
  # ============================================================
  opensearch-file-api:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
      args:
        VERSION: dev
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: opensearch-file-api
    environment:
      - OPENSEARCH_SERVER_HOST=0.0.0.0
      - OPENSEARCH_SERVER_PORT=8080
      - OPENSEARCH_OPENSEARCH_HOST=opensearch
      - OPENSEARCH_OPENSEARCH_PORT=9200
      - OPENSEARCH_OPENSEARCH_USERNAME=admin
      - OPENSEARCH_OPENSEARCH_PASSWORD=Str0ng!P@ssw0rd
      - OPENSEARCH_OPENSEARCH_SECURE=false
      - OPENSEARCH_STORAGE_TYPE=s3
      - OPENSEARCH_STORAGE_S3BUCKET=opensearch-files
      - OPENSEARCH_STORAGE_S3REGION=us-east-1
      - OPENSEARCH_STORAGE_S3ENDPOINT=http://minio:9000
      - OPENSEARCH_STORAGE_S3KEYID=minioadmin
      - OPENSEARCH_STORAGE_S3SECRET=minioadmin123
      - OPENSEARCH_STORAGE_USE_PATH_STYLE=true
      - OPENSEARCH_STORAGE_IMAGE_OCR=true
      - OPENSEARCH_STORAGE_IMAGE_OCR_LANG=eng
      - OPENSEARCH_JWT_SECRET=dev-secret-key-change-in-production
      - OPENSEARCH_SERVER_MODE=debug
      - OPENSEARCH_LOG_LEVEL=debug
      - OPENSEARCH_LOG_FORMAT=console

      # Embedding disabled by default (set openai/local/clip + profile to enable)
      - OPENSEARCH_EMBEDDING_PROVIDER=none

      # ---- 嵌入服务配置 (选一种，与 profile 配合) ----

      # 模式 1: Ollama 文本嵌入 (docker compose --profile ollama up)
      # - OPENSEARCH_EMBEDDING_PROVIDER=local
      # - OPENSEARCH_EMBEDDING_MODEL=nomic-embed-text
      # - OPENSEARCH_EMBEDDING_API_URL=http://ollama:11434
      # - OPENSEARCH_EMBEDDING_TIMEOUT=60

      # 模式 2: CLIP 多模态 (docker compose --profile clip up)
      # - OPENSEARCH_EMBEDDING_PROVIDER=clip
      # - OPENSEARCH_EMBEDDING_API_URL=http://clip-server:8000
      # - OPENSEARCH_EMBEDDING_TIMEOUT=60

      # 模式 3: OpenAI 兼容 API (任何兼容服务)
      # - OPENSEARCH_EMBEDDING_PROVIDER=openai
      # - OPENSEARCH_EMBEDDING_MODEL=text-embedding-3-small
      # - OPENSEARCH_EMBEDDING_API_KEY=sk-xxx
      # - OPENSEARCH_EMBEDDING_API_URL=http://ollama:11434/v1/embeddings
      # - OPENSEARCH_EMBEDDING_DIMENSIONS=768
    ports:
      - "18080:8080"
    volumes:
      - api-data:/app/data/files
    depends_on:
      opensearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - opensearch-net
    # Allow containers to reach host services (e.g. mock embedding server on CI)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  opensearch-net:
    driver: bridge

volumes:
  opensearch-data:
  minio-data:
  api-data:
  ollama-data:
